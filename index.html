<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reserva tu cita</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: auto; }
    input, select { width: 100%; padding: 8px; margin: 8px 0; }
    button { padding: 10px; width: 100%; background: green; color: white; border: none; }
  </style>
</head>
<body>
  <h2>Reserva tu cita</h2>
  <form id="reservaForm">
    <input type="text" name="nombre" placeholder="Tu nombre" required>
    <input type="date" name="fecha" required>
    <input type="time" name="hora" required>
    <select name="servicio" required>
      <option value="">Elige un servicio</option>
      <option value="Corte de cabello">Corte de cabello</option>
      <option value="Consulta">Consulta</option>
      <option value="Asesoría">Asesoría</option>
    </select>
    <button type="submit">Reservar</button>
  </form>
  <p id="mensaje"></p>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwIbhtNbwlzqGwU9OReVSA5E2oEO0icaSPWP3LqQZCzTw7mqIlLN_qVQ6AL7hDfDt0p/exec "; // Pega aquí tu URL del script

    document.getElementById("reservaForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const datos = {
        nombre: this.nombre.value,
        fecha: this.fecha.value,
        hora: this.hora.value,
        servicio: this.servicio.value
      };

      fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify(datos)
      })
      .then(res => res.text())
      .then(mensaje => {
        document.getElementById("mensaje").innerText = mensaje;
        this.reset();
      })
      .catch(err => {
        document.getElementById("mensaje").innerText = "Error al reservar.";
        console.error(err);
      });
    });
  </script>
</body>
</html>
